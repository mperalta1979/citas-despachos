<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APP CITAS AGENDADAS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1F5FA8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Citas Agendadas">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#17212E; --ink-2:#56647A;
  --line:#CFD7E2; --line-2:#E3E8EF;
  --head:#D9E3F0; --head-ink:#1B3556;
  --accent:#1F5FA8; --accent-ink:#FFFFFF; --accent-soft:#E3EDF8;
  --ok-bg:#C2E3A8; --ok-ink:#1F4712; --na-bg:#E4F1D9; --na-ink:#3F6A2B;
  --bad-bg:#FFC7CE; --bad-ink:#9C0006; --warn-bg:#FFE7A8; --warn-ink:#6B4A00;
  --date-bg:#FFC000; --date-ink:#3B2A00; --late-bg:#F08A5D; --late-ink:#3A1200;
  --clash-bg:#E4D5F5; --clash-ink:#4A2678;
  --t-ready:#5FAE3F; --t-part:#D9A400; --t-risk:#D63F4F;
  --shadow:0 8px 30px rgba(20,30,50,.22); --focus:#1F5FA8;
  font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151C; --surface:#18202A; --surface-2:#1E2733; --ink:#E7ECF3; --ink-2:#9BA9BD;
    --line:#2D3848; --line-2:#242E3B; --head:#22354E; --head-ink:#D3E3F8;
    --accent:#6EA8E6; --accent-ink:#0B1826; --accent-soft:#1F3552;
    --ok-bg:#2F5A22; --ok-ink:#D3F2BE; --na-bg:#25391F; --na-ink:#B4D7A0;
    --bad-bg:#5C2530; --bad-ink:#FFC1C8; --warn-bg:#5A4712; --warn-ink:#FFE2A0;
    --date-bg:#B98600; --date-ink:#FFFFFF; --late-bg:#A8482A; --late-ink:#FFFFFF;
    --clash-bg:#3F2E5A; --clash-ink:#E3D3FA; --shadow:0 8px 30px rgba(0,0,0,.55); --focus:#8FBCEF;
  }
}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#18202A; --surface-2:#1E2733; --ink:#E7ECF3; --ink-2:#9BA9BD;
  --line:#2D3848; --line-2:#242E3B; --head:#22354E; --head-ink:#D3E3F8;
  --accent:#6EA8E6; --accent-ink:#0B1826; --accent-soft:#1F3552;
  --ok-bg:#2F5A22; --ok-ink:#D3F2BE; --na-bg:#25391F; --na-ink:#B4D7A0;
  --bad-bg:#5C2530; --bad-ink:#FFC1C8; --warn-bg:#5A4712; --warn-ink:#FFE2A0;
  --date-bg:#B98600; --date-ink:#FFFFFF; --late-bg:#A8482A; --late-ink:#FFFFFF;
  --clash-bg:#3F2E5A; --clash-ink:#E3D3FA; --shadow:0 8px 30px rgba(0,0,0,.55); --focus:#8FBCEF;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.4}
[hidden]{display:none!important}
*{box-sizing:border-box}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.grow{flex:1}
.muted{color:var(--ink-2)}
button{font:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column;min-height:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-size:17px;font-weight:600;margin:0 6px 0 0}
.sync{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:12px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-2)}
.sync.ok i{background:var(--t-ready)} .sync.err i,.sync.off i{background:var(--t-risk)}
.me{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:12px}
.me img{width:24px;height:24px;border-radius:50%}
.role{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);text-transform:uppercase;letter-spacing:.02em}
.role.admin{background:var(--accent-soft);color:var(--accent)}
.btn{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad-ink);border-color:var(--bad-bg);background:var(--bad-bg)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.ib{width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);cursor:pointer;display:inline-grid;place-items:center;flex:none}
.ib:hover{background:var(--accent-soft);color:var(--accent)}

.banner{padding:8px 16px;background:var(--warn-bg);color:var(--warn-ink);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.err{background:var(--bad-bg);color:var(--bad-ink)}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 11px;cursor:pointer;height:28px}
.chip .n{margin-left:6px;font-weight:600;font-variant-numeric:tabular-nums}
.chip .n.has{color:var(--bad-ink);background:var(--bad-bg);border-radius:999px;padding:0 6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .n.has{background:rgba(255,255,255,.9);color:#9C0006}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);cursor:pointer}
.search{width:250px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{height:30px;padding:0 14px;border:0;background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav .lbl{font-weight:600;min-width:150px;text-align:center}
.legend{color:var(--ink-2);font-size:12px}

main{flex:1;min-height:0;overflow:auto;background:var(--surface)}

#tbl{border-collapse:separate;border-spacing:0;table-layout:fixed}
#tbl th,#tbl td{border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:0 8px;height:30px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:var(--surface)}
#tbl thead th{position:sticky;background:var(--head);color:var(--head-ink);z-index:3;border-color:var(--line)}
#tbl .r1 th{top:0;height:36px;font-size:11px;font-weight:600;line-height:1.15;white-space:normal;padding:2px 6px}
#tbl .r2 th{top:36px;height:32px;padding:3px 4px}
#tbl .c-act{position:sticky;left:0;z-index:2;background:var(--surface);padding:0 4px}
#tbl thead .c-act{z-index:4;background:var(--head)}
#tbl .lbl{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;height:100%;display:flex;align-items:center}
#tbl th[aria-sort="ascending"] .lbl::after{content:" ▲";font-size:9px;margin-left:3px}
#tbl th[aria-sort="descending"] .lbl::after{content:" ▼";font-size:9px;margin-left:3px}
.flt{width:100%;height:24px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);font:inherit;font-size:12px;padding:0 5px}
#tbl td.c-date,#tbl td.c-txt{font-variant-numeric:tabular-nums}
#tbl td.c-date{text-align:center}
#tbl tbody tr:hover td.c-txt,#tbl tbody tr:hover td.c-act,#tbl tbody tr:hover td.c-date:not(.d-soon):not(.d-late){background:var(--accent-soft)}
#tbl tr.closed td.c-txt,#tbl tr.closed td.c-date{color:var(--ink-2)}
.d-soon{background:var(--date-bg)!important;color:var(--date-ink)!important;font-weight:600}
.d-late{background:var(--late-bg)!important;color:var(--late-ink)!important;font-weight:600}
.st-ok{background:var(--ok-bg);color:var(--ok-ink)}
.st-na{background:var(--na-bg);color:var(--na-ink)}
.st-bad{background:var(--bad-bg);color:var(--bad-ink)}
.st-warn{background:var(--warn-bg);color:var(--warn-ink)}
.st-off{background:var(--surface-2);color:var(--ink-2)}
#tbl td.st-ok{background:var(--ok-bg);color:var(--ok-ink)}
#tbl td.st-na{background:var(--na-bg);color:var(--na-ink)}
#tbl td.st-bad{background:var(--bad-bg);color:var(--bad-ink)}
#tbl td.st-warn{background:var(--warn-bg);color:var(--warn-ink)}
#tbl td.st-off{background:var(--surface-2);color:var(--ink-2)}
#tbl td.st-empty{background:var(--surface)}
#tbl td.c-sel{padding:0}
.selwrap{display:flex;align-items:center;height:100%}
.selwrap .cellsel{flex:1;width:auto;min-width:0}
.cellsel{width:100%;height:29px;border:0;background:transparent;color:inherit;font:inherit;font-weight:500;text-align:center;text-align-last:center;appearance:none;-webkit-appearance:none;cursor:pointer;padding:0 6px}
.notabtn{width:22px;height:22px;flex:none;margin-right:2px}
.notabtn.has{color:var(--accent)}
.cellsel:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.cellsel:disabled{cursor:default;opacity:1}
select option{background:var(--surface);color:var(--ink)}
.actwrap{display:flex;align-items:center;gap:4px}
.editbtn{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;flex:none}
.histbtn{flex:none}
.flag{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;line-height:1.5;white-space:nowrap}
.f-late{background:var(--late-bg);color:var(--late-ink)}
.f-risk{background:var(--bad-bg);color:var(--bad-ink)}
.f-clash{background:var(--clash-bg);color:var(--clash-ink)}
.f-sinconfirmar{background:#D32F2F;color:#fff;font-weight:700}
.f-closed{background:var(--surface-2);color:var(--ink-2)}
.emptymsg{position:sticky;left:16px;width:min(560px,86vw);padding:36px 0;white-space:normal;color:var(--ink-2)}
#tbl td.emptycell{height:auto;border:0}

#week{display:grid;grid-template-columns:repeat(7,minmax(200px,1fr));min-height:100%;min-width:1400px}
.wday{border-right:1px solid var(--line-2);padding:0 8px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.wday>header{position:sticky;top:0;background:inherit;padding:10px 2px 6px;display:flex;justify-content:space-between;font-weight:600;border-bottom:1px solid var(--line-2);z-index:1}
.wday.today{background:var(--accent-soft)}
.wday .dc{color:var(--ink-2);font-weight:500}
.wempty{color:var(--ink-2);margin:6px 2px;font-size:12px}
.wcard{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);border-left-width:5px;background:var(--surface);color:var(--ink);padding:7px 9px;border-radius:6px;cursor:pointer;width:100%}
.wcard:hover{border-color:var(--accent)}
.wcard .w1{display:flex;justify-content:space-between;gap:6px}
.wcard .w1 span{color:var(--ink-2);font-size:12px}
.wcard .w2{font-weight:600}
.wcard .w3{color:var(--ink-2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcard .w4{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:3px;font-size:12px}
.wcard .w5{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.t-ready{border-left-color:var(--t-ready)} .t-part{border-left-color:var(--t-part)} .t-risk{border-left-color:var(--t-risk)} .t-closed{border-left-color:var(--line);opacity:.7}
.dots{display:inline-flex;gap:3px}

#month{min-height:100%}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);min-width:900px}
.mweekhead{padding:6px 8px;font-size:12px;font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--line-2);background:var(--surface-2);position:sticky;top:0}
.mday{border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);min-height:100px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;background:var(--surface)}
.mday.other{background:var(--surface-2);opacity:.55}
.mday.today{background:var(--accent-soft)}
.mdnum{font-size:12px;font-weight:600;color:var(--ink-2)}
.mitem{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--line);background:var(--surface);color:var(--ink);padding:2px 5px;border-radius:4px;cursor:pointer;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mitem:hover{border-color:var(--accent)}
.mitem.t-ready{border-left-color:var(--t-ready)} .mitem.t-part{border-left-color:var(--t-part)} .mitem.t-risk{border-left-color:var(--t-risk)} .mitem.t-closed{border-left-color:var(--line);opacity:.7}
.mmore{font-size:11px;color:var(--ink-2);padding:1px 5px}
.dot{width:10px;height:10px;border-radius:2px;border:1px solid var(--ink-2);display:inline-block}
.dot.st-empty{background:transparent;border-style:dashed}

.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,18,30,.5);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 4vh) 12px calc(env(safe-area-inset-bottom,0px) + 12px);overflow:auto;z-index:50}
.sheet{background:var(--surface);color:var(--ink);border-radius:10px;box-shadow:var(--shadow);width:min(780px,100%);display:flex;flex-direction:column}
.sheet>header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet h2{margin:0;font-size:16px;font-weight:600}
.mbody{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.sheet>footer{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 10px 10px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 12px}
.f{grid-column:span 2;display:flex;flex-direction:column;gap:4px;min-width:0}
.f.s3{grid-column:span 3} .f.s6{grid-column:span 6} .f.s4{grid-column:span 4}
.fl{font-size:12px;font-weight:500;color:var(--ink-2)}
.fh{font-size:11.5px;color:var(--ink-2)}
.inp{width:100%;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;padding:0 8px}
textarea.inp{height:auto;min-height:64px;padding:6px 8px;resize:vertical}
.inp.st-ok{background:var(--ok-bg);color:var(--ok-ink)} .inp.st-na{background:var(--na-bg);color:var(--na-ink)} .inp.st-bad{background:var(--bad-bg);color:var(--bad-ink)} .inp.st-warn{background:var(--warn-bg);color:var(--warn-ink)} .inp.st-off{background:var(--surface-2);color:var(--ink-2)}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0;padding:10px 12px 12px}
legend{padding:0 6px;font-weight:600}
.hint{border-radius:6px;padding:8px 10px;font-weight:500}
.hint.ok{background:var(--ok-bg);color:var(--ok-ink)} .hint.bad{background:var(--bad-bg);color:var(--bad-ink)} .hint.warn{background:var(--warn-bg);color:var(--warn-ink)} .hint.clash{background:var(--clash-bg);color:var(--clash-ink)}
.hint+.hint{margin-top:6px}
.err-msg{color:var(--bad-ink);background:var(--bad-bg);padding:6px 10px;border-radius:6px}
.hist{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.hist summary{cursor:pointer;font-weight:600}
.hist ul{margin:8px 0 0;padding-left:18px;color:var(--ink-2);font-size:12px}
.hist li{margin:3px 0}
.hist.plain ul{margin:0;padding-left:18px}
.was{text-decoration:line-through}
.mrow{display:grid;grid-template-columns:170px 150px 1fr 28px;gap:8px;align-items:start;margin-bottom:8px}
.trow{display:grid;grid-template-columns:120px 190px 130px 1fr 28px;gap:8px;align-items:start;margin-bottom:8px}
.mtools{display:flex;gap:8px;flex-wrap:wrap}
.prev{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.prev b{font-variant-numeric:tabular-nums}

.sheet.login{width:min(420px,100%);margin-top:8vh}
.sheet.wide{width:min(920px,97vw)}
.dashgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.dashcard{border:1px solid var(--line);border-radius:10px;padding:14px}
.dashcard h3{margin:0 0 10px;font-size:13px;font-weight:600}
.pie{width:150px;height:150px;border-radius:50%;margin:0 auto 12px}
.legend2{list-style:none;margin:0;padding:0;font-size:12px;color:var(--ink-2)}
.legend2 li{display:flex;align-items:center;gap:6px;margin:4px 0}
.dot2{width:10px;height:10px;border-radius:3px;flex:none}
.ranklist{margin:0;padding-left:18px;font-size:12px;color:var(--ink)}
.ranklist li{margin:6px 0}
.ranklist .muted{font-size:11px}
.rtablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.rtable{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
.rtable th,.rtable td{border-bottom:1px solid var(--line-2);padding:7px 10px;text-align:center}
.rtable thead th{background:var(--surface-2);font-weight:600;position:relative}
.rtable td.rperm{text-align:left;white-space:normal;min-width:200px;color:var(--ink-2)}
.rtable .rrmv{width:18px;height:18px;margin-left:4px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;vertical-align:middle;border-radius:4px}
.rtable .rrmv:hover{background:var(--bad-bg);color:var(--bad-ink)}
.pwdwrap{position:relative;display:flex}
.pwdwrap .inp{padding-right:36px}
.pwdtoggle{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;display:inline-grid;place-items:center;border-radius:5px}
.pwdtoggle:hover{background:var(--accent-soft);color:var(--accent)}
.me .av{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-grid;place-items:center;font-weight:600;font-size:12px}
.urow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.urow .uinfo{flex:1;min-width:120px}
.urow .un{font-weight:500}
.urow .btns{display:flex;gap:6px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
#toast.show{opacity:1}
#toast.err{background:var(--bad-ink);color:#fff}

@media (max-width:640px){
  .f,.f.s3,.f.s4{grid-column:span 6}
  .mrow{grid-template-columns:1fr 28px} .mrow .m-t{grid-column:1/-1;grid-row:2} .mrow .m-d{grid-column:1/-1;grid-row:3}
  .trow{grid-template-columns:1fr 28px} .trow .t-nom,.trow .t-tel,.trow .t-ch{grid-column:1/-1}
  .search{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="app">
  <header class="top">

const slug = s => nrm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 120) || 'cliente';
const clip = v => String(v ?? '').slice(0, 200);
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const daysFrom = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const isISO = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');

const millisOf = t => (t && typeof t.toMillis === 'function') ? t.toMillis() : (t && typeof t.seconds === 'number' ? t.seconds * 1000 : (t ? +new Date(t) : NaN));

const shortName = n => n || 'sistema';

const ROLE_LABEL_BASE = {admin:'Administrador', editor:'Editor', lector:'Lector', programador:'Programador'};
const PERMS_DEF = [

  lector: {verDashboard:true, verClientes:true, verTransportistas:true, crearCita:false, editarCita:false, editarNvRecep:false, eliminarCita:false, registrarEntrega:false, importarExcel:false, exportarExcel:true, exportarDashboard:true, editarClientes:false, editarTransportistas:false, configurarNtfy:false, gestionarUsuarios:false},

  programador: {verDashboard:false, verClientes:false, verTransportistas:false, crearCita:false, editarCita:false, editarNvRecep:true, eliminarCita:false, registrarEntrega:false, importarExcel:false, exportarExcel:false, exportarDashboard:false, editarClientes:false, editarTransportistas:false, configurarNtfy:false, gestionarUsuarios:false},

let ROLES = ['admin', 'editor', 'lector', 'programador'];
let ROLE_LABEL = {...ROLE_LABEL_BASE};
let ROLE_PERMS = {editor:{...DEFAULT_ROLE_PERMS.editor}, lector:{...DEFAULT_ROLE_PERMS.lector}, programador:{...DEFAULT_ROLE_PERMS.programador}};
function can(action) {
  if (ROLE === 'admin') return true; // el admin siempre puede todo, pase lo que pase en la tabla
  return !!(ROLE_PERMS[ROLE] && ROLE_PERMS[ROLE][action]);
}
const ENTREGA_PUNTUALIDAD = ['A tiempo', 'Anticipada', 'Atrasada'];
const ENTREGA_PRESENTE = ['Sí, alguien recibió', 'No se presentó nadie (no-show)'];
const ENTREGA_CARGA = ['Conforme', 'Con diferencia de cantidad', 'Con daño o avería', 'Rechazo parcial'];
const ENTREGA_DOC = ['Firmado sin observaciones', 'Firmado con observaciones', 'Sin firma (pendiente de recuperar)'];
const ENTREGA_MOTIVO_NO = ['Cliente no se presentó / no recibió', 'Cliente rechazó la mercadería', 'Documentación incompleta o incorrecta', 'Mercadería dañada detectada en recepción', 'Fuera de horario de recepción', 'Problema con el vehículo o transporte', 'Otro'];
const DASH_PALETTE = ['#1565C0', '#2E7D32', '#F9A825', '#C62828', '#6A1B9A', '#00897B', '#8D6E63'];
async function sha256hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ============ modelo ============ */
const COLS = [
  {k:'estado',   h:'ESTADO', type:'select', opts:['PENDIENTE','DESPACHADA','REPROGRAMADA','CANCELADA'], w:120},
  {k:'conforme', h:'RECIBIDA', type:'select', opts:['','SI','NO'], w:110},
  {k:'cliente',  h:'CLIENTE', type:'text', w:130},
  {k:'oc',       h:'OC', type:'text', w:150},
  {k:'nv',       h:'NV', type:'text', w:150},
  {k:'fechaNV',  h:'FECHA NV', type:'date', w:94},
  {k:'nroCita',  h:'Nº CITA', type:'text', w:92},
  {k:'fechaCita',h:'FECHA CITA', type:'date', w:106},
  {k:'horaCita', h:'HORA CITA', type:'time', w:80},
  {k:'direccion',h:'DIRECCIÓN DE DESPACHO', type:'text', w:300},
  {k:'transportista', h:'TRANSPORTISTA', type:'text', w:150},
  {k:'nvRecep',  h:'NV RECEP. EN DESPACHO', type:'select', opts:['','SI','NO','INCOMPLETA','N/A'], w:132},
  {k:'pallet',   h:'PALLETIZADO Y ETIQUETADO', type:'select', opts:['','PREPARADO','EN PREPARACIÓN','N/A'], w:170},
  {k:'pallets',  h:'PALLETS Y BULTOS', type:'text', w:160},
  {k:'nroGuia',  h:'NRO. GUÍA', type:'text', w:160},
  {k:'obs',      h:'OBSERVACIONES', type:'text', w:260},
];
const ACT_W = 220;
const FIELDS = COLS.map(c => c.k);
const LABEL = Object.fromEntries(COLS.map(c => [c.k, c.h.charAt(0) + c.h.slice(1).toLowerCase()]));
const blank = () => ({estado:'PENDIENTE', cliente:'', oc:'', nv:'', fechaNV:'', nroCita:'', fechaCita:'', horaCita:'', direccion:'', transportista:'', nvRecep:'', notaNvRecep:'', pallet:'', pallets:'', nroGuia:'', conforme:'', obs:''});
const fromDoc = snap => ({...blank(), ...snap.data(), id:snap.id});
const CHECK = [
  {k:'nvRecep', label:'NV recepcionada en despacho', risk:'NV sin recepcionar en despacho (no se podría despachar a tiempo)'},
  {k:'pallet',  label:'Palletizado y etiquetado',    risk:'Palletizado y etiquetado pendiente'},
];
const isOk = v => v === 'SI' || v === 'PREPARADO' || v === 'N/A';
const RISK_DAYS = 2; // días de anticipación para marcar "en riesgo" y pintar la fecha
const FLAGTXT = {late:'Atrasada', risk:'En riesgo', clash:'Choque', sinconfirmar:'Sin Confirmar'};
// Fecha y hora exactas de la cita (si no hay hora, se considera vencida recién al cierre del día).
function citaMoment(c) {
  if (!isISO(c.fechaCita)) return null;
  const d = parseISO(c.fechaCita);
  const m = /^(\d{1,2}):(\d{2})$/.exec(c.horaCita || '');
  if (m) d.setHours(+m[1], +m[2], 0, 0); else d.setHours(23, 59, 59, 999);
  return d;
}

function stCls(k, v) {
  if (!v) return 'st-empty';
  if (v === 'SI' || v === 'PREPARADO') return 'st-ok';
  if (v === 'N/A') return 'st-na';
  return 'st-bad';
}
function estadoCls(v) {
  return v === 'PENDIENTE' ? 'st-bad' : v === 'DESPACHADA' ? 'st-ok' : v === 'REPROGRAMADA' ? 'st-warn' : 'st-off';
}

/* ============ estado de la app ============ */
let CITAS = [], MASTER = [], MASTERT = [], USUARIOS = [];
const AN = new Map();
let VIEW = 'tabla', QUICK = 'todas', SHOWCLOSED = false, SEARCH = '', F = {}, SORT = {k:'fechaCita', dir:1}, WEEK = 0, MONTH = 0;
let auth = null, db = null;
let SESION = null, NOMBRE = '', UID = '', ROLE = '', ISADMIN = false;
let STARTED = false, LOADED = false, BANNER = '', USUARIOS_LISTOS = false;
let LASTDAY = todayISO(), deferred = false, M = null, lastFocus = null;
let timers = {}, unsubs = [];

/* ============ análisis de cada cita ============ */
const slotKey = c => (c.estado === 'PENDIENTE' && c.fechaCita && c.horaCita && c.direccion)
  ? [c.fechaCita, c.horaCita, nrm(c.direccion)].join('|') : null;

function analyzeOne(c, othersAtSlot) {
  const a = {flags:[], reasons:[], days:null, pending:CHECK.filter(x => !isOk(c[x.k])), ready:false};
  a.ready = !a.pending.length;
  if (isISO(c.fechaCita)) a.days = daysFrom(todayISO(), c.fechaCita);
  if (c.estado === 'PENDIENTE') {
    if (a.days !== null && a.days < 0) {
      a.flags.push('late');
      a.reasons.push(`Fecha vencida hace ${-a.days} ${-a.days === 1 ? 'día' : 'días'} y sigue pendiente`);
    }
    if (a.days !== null && a.days >= 0 && a.days <= RISK_DAYS && !a.ready) {
      a.flags.push('risk');
      a.pending.forEach(p => a.reasons.push(p.risk));
    }
    if (othersAtSlot > 0) {
      a.flags.push('clash');
      a.reasons.push('Otra cita pendiente en el mismo destino, día y hora');
    }
    if (!c.conforme) {
      const dt = citaMoment(c);
      if (dt && dt.getTime() <= Date.now()) {
        a.flags.push('sinconfirmar');
        a.reasons.push('Ya pasó la hora de la cita y la columna "Recibida" sigue vacía');

}
function slotCounts(exceptId) {
  const s = {};
  CITAS.forEach(c => { if (c.id === exceptId) return; const k = slotKey(c); if (k) s[k] = (s[k] || 0) + 1; });
  return s;
}
function computeAnalysis() {
  AN.clear();
  const s = slotCounts(null);
  CITAS.forEach(c => { const k = slotKey(c); AN.set(c.id, analyzeOne(c, k ? s[k] - 1 : 0)); });
}

/* ============ filtros, orden, listas ============ */
function matchF(c) {
  for (const cl of COLS) {
    const f = F[cl.k]; if (!f) continue;
    const val = c[cl.k] ?? '';
    if (cl.type === 'select') {
      if (f === '__empty') { if (val) return false; } else if (val !== f) return false;
    } else {
      const shown = cl.type === 'date' ? `${fmtDate(val)} ${val}` : String(val);
      if (!nrm(shown).includes(nrm(f))) return false;
    }
  }
  return true;
}
function quickOK(c, a) {
  const p = c.estado === 'PENDIENTE';
  switch (QUICK) {
    case 'late': return p && a.flags.includes('late');
    case 'hoy': return p && a.days === 0;
    case 'manana': return p && a.days === 1;
    case 'risk': return p && a.flags.includes('risk');
    case 'clash': return p && a.flags.includes('clash');
    default: return true;
  }
}
function sortList(list) {
  const {k, dir} = SORT;
  const cmp = (x, y) => String(x ?? '').localeCompare(String(y ?? ''), 'es', {numeric:true, sensitivity:'base'});
  return list.sort((a, b) => {
    let r = 0;
    if (k === 'fechaCita') { r = (a.fechaCita || '9999').localeCompare(b.fechaCita || '9999') || (a.horaCita || '99:99').localeCompare(b.horaCita || '99:99'); }
    else if (k === 'horaCita') { r = (a.horaCita || '99:99').localeCompare(b.horaCita || '99:99'); }
    else r = cmp(a[k], b[k]);
    if (!r) r = (a.fechaCita || '').localeCompare(b.fechaCita || '') || (a.horaCita || '').localeCompare(b.horaCita || '') || cmp(a.cliente, b.cliente);
    return r * dir;
  });
}
function visibleList() {
  const q = nrm(SEARCH);
  const list = CITAS.filter(c => {
    if (!SHOWCLOSED && !F.estado && c.estado !== 'PENDIENTE') return false;

    if (q && !nrm([c.cliente, c.oc, c.nv, c.nroCita, c.direccion, c.obs, c.pallets].join(' ')).includes(q)) return false;

}

  F = {};

}

}

function renderWeek(list) {

/* ============ render: mes ============ */
function monthMatrix(year, monthIdx) {
  const first = new Date(year, monthIdx, 1);
  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  const last = new Date(year, monthIdx + 1, 0);
  const weeks = Math.ceil((((first.getDay() + 6) % 7) + last.getDate()) / 7);
  const days = [];
  for (let i = 0; i < weeks * 7; i++) { const d = new Date(start); d.setDate(start.getDate() + i); days.push(d); }
  return days;
}
function monthItemHTML(c) {
  const a = AN.get(c.id), closed = c.estado !== 'PENDIENTE';
  const tone = closed ? 'closed' : (a.flags.includes('late') || a.flags.includes('risk') || a.flags.includes('sinconfirmar')) ? 'risk' : a.ready ? 'ready' : 'part';
  return `<button type="button" class="mitem t-${tone}" data-id="${esc(c.id)}" title="${esc(c.horaCita || 's/h')} · ${esc(c.cliente)}"><b>${esc(c.horaCita || 's/h')}</b> ${esc(c.cliente)}</button>`;
}
function renderMonth(list) {
  const base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + MONTH);
  const year = base.getFullYear(), monthIdx = base.getMonth();
  const days = monthMatrix(year, monthIdx);
  const by = {}; list.forEach(c => { if (c.fechaCita) (by[c.fechaCita] ||= []).push(c); });
  const t = todayISO();
  $('#wkLabel').textContent = `${MES[monthIdx]} ${year}`;
  const MAXITEMS = 4;
  const head = [1,2,3,4,5,6,0].map(i => `<div class="mweekhead">${DIAS[i]}</div>`).join('');
  const cells = days.map(d => {
    const iso = isoOf(d);
    const items = (by[iso] || []).sort((x, y) => (x.horaCita || '99').localeCompare(y.horaCita || '99'));
    const other = d.getMonth() !== monthIdx;
    const shown = items.slice(0, MAXITEMS);
    const more = items.length - shown.length;
    return `<div class="mday${other ? ' other' : ''}${iso === t ? ' today' : ''}"><span class="mdnum">${d.getDate()}</span>${shown.map(monthItemHTML).join('')}${more > 0 ? `<span class="mmore">+${more} más</span>` : ''}</div>`;
  }).join('');
  $('#month').innerHTML = `<div class="mgrid">${head}${cells}</div>`;
}

}

/* ============ avisos: NTFY (mandados directo desde el navegador) ============ */
async function ntfyEnviar(titulo, mensaje, tags = [], prioridad = 3) {
  try {
    const snap = await db.collection('config').doc('ntfy').get();
    if (!snap.exists) return;
    const cfg = snap.data();
    if (!cfg.topic) return; // sin tema configurado, no hay a quién avisar
    const url = cfg.url || 'https://ntfy.sh';
    // Publicar en JSON exige POST a la URL raíz, nunca a la URL del tema.
    const res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({topic: cfg.topic, title: titulo, message: mensaje, tags, priority: prioridad}),
    });
    if (!res.ok) console.warn('NTFY respondió', res.status);
  } catch (e) {
    console.warn('No se pudo avisar a NTFY', e);
  }
}

/* ============ recordatorio diario: citas hoy/mañana con checklist incompleto ============ */
async function checkRecordatorioDiario() {
  if (!LOADED || new Date().getHours() < 8) return; // recién desde las 8:00
  const hoy = todayISO();
  try {
    let debeEnviar = false;
    await db.runTransaction(async tx => {
      const ref = db.collection('config').doc('recordatorioDiario');
      const snap = await tx.get(ref);
      if (snap.exists && snap.data().fecha === hoy) return; // ya se envió hoy (lo hizo otra sesión)
      debeEnviar = true;
      tx.set(ref, {fecha: hoy, enviadoEn: firebase.firestore.FieldValue.serverTimestamp()});
    });
    if (!debeEnviar) return;
    const pendientes = CITAS.filter(c => {
      const a = AN.get(c.id);
      return a && c.estado === 'PENDIENTE' && !a.ready && (a.days === 0 || a.days === 1);
    });
    if (!pendientes.length) return;
    const linea = c => `${c.horaCita || 's/h'} · ${c.cliente || '(sin cliente)'} — ${AN.get(c.id).pending.map(p => p.label).join(', ')}`;
    const deHoy = pendientes.filter(c => AN.get(c.id).days === 0), deManana = pendientes.filter(c => AN.get(c.id).days === 1);
    const partes = [];
    if (deHoy.length) partes.push(`HOY (${deHoy.length}):`, ...deHoy.map(linea));
    if (deManana.length) partes.push(`MAÑANA (${deManana.length}):`, ...deManana.map(linea));
    ntfyEnviar(
      `Checklist pendiente: ${pendientes.length} ${pendientes.length === 1 ? 'cita' : 'citas'} por preparar`,
      partes.join('\n'),
      ['warning'], 4
    ).catch(() => {});
  } catch (e) { console.warn('No se pudo verificar el recordatorio diario', e); }
}

/* ============ datos: Firestore en tiempo real ============ */
function startData() {
  setSync('wait');
  unsubs.push(db.collection('citas').orderBy('fechaCita').onSnapshot(snap => {
    CITAS = snap.docs.map(fromDoc); LOADED = true; setSync('ok'); syncDatalists(); renderAll();
    checkRecordatorioDiario();
  }, err => { setSync('err'); if (!LOADED) { BANNER = errMsg(err); renderAll(true); } }));
  unsubs.push(db.collection('clientesDestinos').onSnapshot(snap => {
    MASTER = snap.docs.map(d => ({n: d.data().cliente || d.id, d: d.data().destinos || [], tel: d.data().telefono || ''})).sort((a, b) => a.n.localeCompare(b.n, 'es'));
    syncDatalists();
  }, () => {}));
  unsubs.push(db.collection('transportistas').onSnapshot(snap => {
    MASTERT = snap.docs.map(d => ({
      rut: d.data().rut || '', n: d.data().nombre || d.id, tel: d.data().telefono || '',
      ch: (d.data().choferes || []).map(x => ({patente:x.patente || '', patenteRampla:x.patenteRampla || '', nombreCorto:x.nombreCorto || '', nombreCompleto:x.nombreCompleto || '', cedula:x.cedula || ''})),
    })).sort((a, b) => a.n.localeCompare(b.n, 'es'));
    syncDatalists();
  }, () => {}));
  unsubs.push(db.collection('config').doc('roles').onSnapshot(onRolesConfig, () => {}));
  timers.day = setInterval(() => {
    if (todayISO() !== LASTDAY) LASTDAY = todayISO();
    renderAll(); // también revisa minuto a minuto si alguna cita quedó "Sin Confirmar"
    checkRecordatorioDiario();
  }, 60000);
}
function stopData() {
  unsubs.forEach(u => u()); unsubs = [];
  clearInterval(timers.day);
  CITAS = []; MASTER = []; MASTERT = []; LOADED = false; STARTED = false;
  renderAll(true);
}

/* ============ datos: escritura ============ */
async function patchCita(id, patch) {
  let notif = null;
  await db.runTransaction(async tx => {
    const ref = db.collection('citas').doc(id);
    const snap = await tx.get(ref);
    if (!snap.exists) throw new Error('La cita ya no existe: puede que otra persona la haya eliminado.');
    const cur = snap.data();
    const now = Date.now(), entries = [];
    for (const k of Object.keys(patch)) {
      const before = cur[k] ?? '';
      if (before !== patch[k]) entries.push({t: now, u: NOMBRE, f: k, a: clip(before), b: clip(patch[k])});
    }
    if (!entries.length) { notif = null; return; }
    const log = [...(cur.log || []), ...entries].slice(-40);
    // Solo avisamos al pasar a "SI" (no en cada guardado posterior).
    notif = (cur.conforme !== 'SI' && patch.conforme === 'SI')
      ? {...cur, ...patch, modificadoPor: NOMBRE} : null;
    tx.update(ref, {...patch, log, modificadoPor: NOMBRE, modificadoEn: firebase.firestore.FieldValue.serverTimestamp()});
  });
  if (notif) {
    ntfyEnviar(
      'Cita entregada conforme: ' + (notif.cliente || '(sin cliente)'),
      [
        `${fmtDate(notif.fechaCita)} ${notif.horaCita || 's/h'}`,
        notif.direccion || '',
        `NV: ${notif.nv || '—'} · OC: ${notif.oc || '—'}`,
        notif.pallets ? `Pallets y bultos: ${notif.pallets}` : '',
        `Confirmada por ${shortName(notif.modificadoPor)}`,
      ].filter(Boolean).join('\n'),
      ['white_check_mark'], 3
    ).catch(() => {});
  }
}
async function createCita(d) {
  await db.collection('citas').add({
    ...d, origen:'app', log:[{t:Date.now(), u:NOMBRE, f:'_creada'}],
    creadoPor:NOMBRE, creadoEn:firebase.firestore.FieldValue.serverTimestamp(), modificadoPor:NOMBRE, modificadoEn:firebase.firestore.FieldValue.serverTimestamp(),
  });
  learnMaster([d]).catch(() => {});
  ntfyEnviar(

      `Ingresada por ${shortName(NOMBRE)}`,
    ].filter(Boolean).join('\n'),
    ['calendar'], 3
  ).catch(() => {});
}
async function removeCita(id) {
  await db.collection('citas').doc(id).delete();
}
async function saveResultadoEntrega(id, valor, entregaObj) {
  let notif = null;
  await db.runTransaction(async tx => {
    const ref = db.collection('citas').doc(id);
    const snap = await tx.get(ref);
    if (!snap.exists) throw new Error('La cita ya no existe: puede que otra persona la haya eliminado.');
    const cur = snap.data();
    const now = Date.now(), entries = [];
    if ((cur.conforme || '') !== valor) entries.push({t:now, u:NOMBRE, f:'conforme', a:clip(cur.conforme || ''), b:clip(valor)});
    entries.push({t:now, u:NOMBRE, f:'_entrega', a:'', b: (cur.entrega ? 'Actualizó' : 'Registró') + ' el resultado de la entrega (' + (valor === 'SI' ? 'conforme' : 'no conforme') + ')'});
    const log = [...(cur.log || []), ...entries].slice(-40);
    // Avisamos por NTFY cada vez que se registra o cambia el resultado (conforme o no conforme).
    notif = {...cur, conforme:valor, entrega:entregaObj, modificadoPor:NOMBRE};
    tx.update(ref, {conforme:valor, entrega:entregaObj, log, modificadoPor:NOMBRE, modificadoEn:firebase.firestore.FieldValue.serverTimestamp()});
  });
  if (notif) {
    if (notif.conforme === 'SI') {
      ntfyEnviar(
        'Cita entregada conforme: ' + (notif.cliente || '(sin cliente)'),
        [
          `${fmtDate(notif.fechaCita)} ${notif.horaCita || 's/h'}`,
          notif.direccion || '',
          `NV: ${notif.nv || '—'} · OC: ${notif.oc || '—'}`,
          notif.entrega.puntualidad ? `Puntualidad: ${notif.entrega.puntualidad}` : '',
          notif.entrega.carga ? `Carga: ${notif.entrega.carga}` : '',
          notif.entrega.documento ? `Documento: ${notif.entrega.documento}` : '',
          `Confirmada por ${shortName(notif.modificadoPor)}`,
        ].filter(Boolean).join('\n'),
        ['white_check_mark'], 3
      ).catch(() => {});
    } else {
      ntfyEnviar(
        'Cita NO conforme: ' + (notif.cliente || '(sin cliente)'),
        [
          `${fmtDate(notif.fechaCita)} ${notif.horaCita || 's/h'}`,
          notif.direccion || '',
          `NV: ${notif.nv || '—'} · OC: ${notif.oc || '—'}`,
          notif.entrega.motivo ? `Motivo: ${notif.entrega.motivo}` : '',
          `Registrada por ${shortName(notif.modificadoPor)}`,
        ].filter(Boolean).join('\n'),
        ['warning'], 4
      ).catch(() => {});
    }
  }
}
async function learnMaster(rows) {
  const byKey = new Map(MASTER.map(x => [nrm(x.n), {n:x.n, d:[...x.d], tel:x.tel || ''}])), touched = new Set();
  rows.forEach(r => {
    const n = (r.cliente || '').trim(); if (!n) return;
    const key = nrm(n); let it = byKey.get(key);
    if (!it) { it = {n, d:[], tel:''}; byKey.set(key, it); touched.add(key); }
    const dir = (r.direccion || '').trim();
    if (dir && !it.d.some(x => nrm(x) === nrm(dir))) { it.d.push(dir); touched.add(key); }
  });
  if (!touched.size) return;
  const batch = db.batch();
  touched.forEach(key => { const it = byKey.get(key); batch.set(db.collection('clientesDestinos').doc(slug(it.n)), {cliente:it.n, destinos:it.d, telefono:it.tel || ''}); });
  await batch.commit();
}

function updateHint() {
  const h = $('#hint'); if (!h || !M || M.kind !== 'cita') return;
  const d = readForm(), s = slotCounts(M.id), k = slotKey(d);
  const a = analyzeOne(d, k ? (s[k] || 0) : 0);
  const out = [];
  if (d.estado !== 'PENDIENTE') out.push(`<div class="hint warn">Cita en estado ${esc(d.estado)}: no genera alertas.</div>`);
  else {

  CITAS.forEach(c => { if (c.direccion && nrm(c.cliente) === n) set.add(c.direccion); });

/* ============ dashboard ============ */
function pieCSS(parts) {
  const total = parts.reduce((s, p) => s + p.v, 0);
  if (!total) return 'conic-gradient(var(--line-2) 0 100%)';
  let acc = 0, stops = [];
  parts.forEach(p => {
    if (!p.v) return;
    const start = acc, end = acc + (p.v / total) * 100;
    stops.push(`${p.color} ${start}% ${end}%`);
    acc = end;
  });
  return `conic-gradient(${stops.join(',')})`;
}
function dashBlock(title, obj, emptyNote) {
  const entries = Object.entries(obj).filter(([, v]) => v > 0);
  const totalN = entries.reduce((a, [, v]) => a + v, 0);
  if (!totalN) return `<div class="dashcard"><h3>${esc(title)}</h3><p class="muted" style="margin:0">${esc(emptyNote || 'Sin datos todavía.')}</p></div>`;
  const parts = entries.map(([label, v], i) => ({label, v, color:DASH_PALETTE[i % DASH_PALETTE.length]}));
  const legend = parts.map(p => `<li><i class="dot2" style="background:${p.color}"></i>${esc(p.label)} — <b>${p.v}</b> (${Math.round(p.v / totalN * 100)}%)</li>`).join('');
  return `<div class="dashcard"><h3>${esc(title)}</h3><div class="pie" style="background:${pieCSS(parts)}"></div><ul class="legend2">${legend}</ul></div>`;
}
const MESES3 = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function monthLabel(ym) { const [y, m] = ym.split('-'); return `${MESES3[+m - 1]} ${y.slice(2)}`; }
function lineSVG(points) {
  const W = 620, H = 180, padL = 32, padR = 14, padT = 16, padB = 28;
  const plotW = W - padL - padR, plotH = H - padT - padB, n = points.length;
  const xAt = i => padL + (n === 1 ? plotW / 2 : (plotW * i / (n - 1)));
  const yAt = pct => padT + plotH - (plotH * pct / 100);
  const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${xAt(i).toFixed(1)},${yAt(p.pct).toFixed(1)}`).join(' ');
  const grid = [0, 50, 100].map(v => `<line x1="${padL}" y1="${yAt(v).toFixed(1)}" x2="${W - padR}" y2="${yAt(v).toFixed(1)}" stroke="var(--line-2)" stroke-width="1"/><text x="${padL - 6}" y="${(yAt(v) + 3).toFixed(1)}" font-size="9" text-anchor="end" fill="var(--ink-2)">${v}%</text>`).join('');
  const dots = points.map((p, i) => `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(p.pct).toFixed(1)}" r="3.5" fill="#1565C0"><title>${esc(p.label)}: ${p.pct}% conforme (${p.conforme} de ${p.conforme + p.noConforme} con resultado)</title></circle>`).join('');
  const labels = points.map((p, i) => `<text x="${xAt(i).toFixed(1)}" y="${H - 6}" font-size="9" text-anchor="middle" fill="var(--ink-2)">${esc(p.label)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Evolución mensual del % de citas conformes">${grid}<path d="${path}" fill="none" stroke="#1565C0" stroke-width="2"/>${dots}${labels}</svg>`;
}
function evolucionHTML(points) {
  if (!points.length) return `<div class="dashcard" style="grid-column:1/-1"><h3>Evolución mensual (% conforme)</h3><p class="muted" style="margin:0">Aún no hay suficientes citas con resultado registrado para mostrar una tendencia.</p></div>`;
  return `<div class="dashcard" style="grid-column:1/-1"><h3>Evolución mensual (% conforme)</h3>${lineSVG(points)}</div>`;
}
function rankingHTML(rows) {

  return `<div class="dashcard"><h3>Clientes con más problemas de entrega</h3><ol class="ranklist">${items}</ol></div>`;
}
/* ============ dashboard: filtros y cálculo (reactivo) ============ */
let DASHF = {desde:'', hasta:'', transportista:'', q:''};
function filterCitasForDashboard() {
  return CITAS.filter(c => {
    if (DASHF.desde && (!c.fechaCita || c.fechaCita < DASHF.desde)) return false;
    if (DASHF.hasta && (!c.fechaCita || c.fechaCita > DASHF.hasta)) return false;
    if (DASHF.transportista && nrm(c.transportista || '') !== nrm(DASHF.transportista)) return false;
    if (DASHF.q) {
      const q = nrm(DASHF.q);
      if (!nrm(c.cliente || '').includes(q) && !nrm(c.direccion || '').includes(q)) return false;
    }
    return true;
  });
}
function computeDashboardStats(list) {
  const estado = {'Recibida conforme':0, 'Recibida no conforme':0, 'Atrasada':0, 'Pendiente (en plazo)':0};
  const punt = {}, carga = {}, doc = {}, motivo = {};
  const porCliente = new Map(), porMes = new Map();
  list.forEach(c => {
    const a = AN.get(c.id) || {flags:[]};
    if (c.conforme === 'SI') estado['Recibida conforme']++;
    else if (c.conforme === 'NO') estado['Recibida no conforme']++;
    else if (c.estado === 'PENDIENTE' && a.flags.includes('late')) estado['Atrasada']++;
    else if (c.estado === 'PENDIENTE') estado['Pendiente (en plazo)']++;
    if (c.conforme === 'SI' && c.entrega) {
      const e = c.entrega;
      if (e.puntualidad) punt[e.puntualidad] = (punt[e.puntualidad] || 0) + 1;
      if (e.carga) carga[e.carga] = (carga[e.carga] || 0) + 1;
      if (e.documento) doc[e.documento] = (doc[e.documento] || 0) + 1;
    }
    if (c.conforme === 'NO' && c.entrega && c.entrega.motivo) motivo[c.entrega.motivo] = (motivo[c.entrega.motivo] || 0) + 1;
    const esAtraso = c.estado === 'PENDIENTE' && a.flags.includes('late');
    const esChoque = c.estado === 'PENDIENTE' && a.flags.includes('clash');
    if (c.conforme === 'NO' || esAtraso || esChoque) {
      const cli = c.cliente || '(sin cliente)';
      if (!porCliente.has(cli)) porCliente.set(cli, {cliente:cli, noConforme:0, atraso:0, choque:0});
      const r = porCliente.get(cli);
      if (c.conforme === 'NO') r.noConforme++;
      if (esAtraso) r.atraso++;
      if (esChoque) r.choque++;
    }
    if (isISO(c.fechaCita)) {
      const mes = c.fechaCita.slice(0, 7);
      if (!porMes.has(mes)) porMes.set(mes, {mes, conforme:0, noConforme:0});
      const m = porMes.get(mes);
      if (c.conforme === 'SI') m.conforme++;
      else if (c.conforme === 'NO') m.noConforme++;
    }
  });
  const ranking = [...porCliente.values()].map(r => ({...r, total:r.noConforme + r.atraso + r.choque})).sort((a, b) => b.total - a.total).slice(0, 10);
  const evolucion = [...porMes.values()].filter(m => (m.conforme + m.noConforme) > 0).sort((a, b) => a.mes.localeCompare(b.mes)).slice(-12)
    .map(m => ({label:monthLabel(m.mes), mesISO:m.mes, conforme:m.conforme, noConforme:m.noConforme, pct:Math.round(m.conforme / (m.conforme + m.noConforme) * 100)}));
  return {total:list.length, estado, punt, carga, doc, motivo, ranking, evolucion};
}

function transHeaderKey(h) {
  if (h === 'RUT') return 'rut';
  if (h === 'NOMBRE') return 'nombre';
  if (h.includes('PATENTE') && h.includes('RAMPLA')) return 'patenteRampla';
  if (h.includes('PATENTE')) return 'patente';
  if (h.includes('CELULAR') || h.includes('TELEFONO') || h.includes('FONO')) return 'telefono';
  if (h.includes('NOMBRE CORTO')) return 'nombreCorto';
  if (h.includes('NOMBRE COMPLETO')) return 'nombreCompleto';
  if (h.includes('CEDULA')) return 'cedula';
  return null;
}
function parseTransportistasXLSX(buf) {
  if (typeof XLSX === 'undefined') throw new Error('No se cargó el lector de Excel. Revisa tu conexión y recarga la página.');
  const wb = XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
  const hi = rows.findIndex(r => r.some(x => nrmU(x) === 'RUT') && r.some(x => nrmU(x) === 'NOMBRE'));
  if (hi < 0) throw new Error('No encontré la fila de encabezados. Necesito al menos las columnas RUT y NOMBRE.');
  const map = {};
  rows[hi].forEach((h, i) => { const k = transHeaderKey(nrmU(h)); if (k && !(k in map)) map[k] = i; });
  const byKey = new Map();
  rows.slice(hi + 1).forEach(r => {
    const g = k => (k in map ? String(r[map[k]] ?? '').trim() : '');
    const rut = g('rut'), nombre = g('nombre');
    if (!rut && !nombre) return;
    const key = nrm(rut || nombre);
    let it = byKey.get(key);
    if (!it) { it = {rut, n: nombre, tel: g('telefono'), ch: []}; byKey.set(key, it); }
    if (!it.tel && g('telefono')) it.tel = g('telefono');
    const ch = {patente: g('patente'), patenteRampla: g('patenteRampla'), nombreCorto: g('nombreCorto'), nombreCompleto: g('nombreCompleto'), cedula: g('cedula')};
    if (ch.patente || ch.nombreCorto || ch.nombreCompleto || ch.cedula || ch.patenteRampla) it.ch.push(ch);
  });
  return [...byKey.values()];
}
function mergeTransportistasImport(items) {

    let it = current.find(y => nrm(y.rut || y.n) === nrm(x.rut || x.n));
    if (!it) { it = {rut:x.rut, n:x.n, tel:x.tel, ch:[]}; current.push(it); }
    else { if (!it.rut && x.rut) it.rut = x.rut; if (!it.tel && x.tel) it.tel = x.tel; }
    x.ch.forEach(c => { if (!it.ch.some(y => nrm(y.patente) === nrm(c.patente) && c.patente)) it.ch.push(c); });
  });
  current.sort((a, b) => a.n.localeCompare(b.n, 'es'));
  $('#trows').innerHTML = current.map(trow).join('');
}

/* ============ importar / exportar Excel ============ */
function headerKey(h) {
  if (h === 'ESTADO') return 'estado';
  if (h === 'CLIENTE') return 'cliente';
  if (h === 'OC') return 'oc';
  if (h === 'NV') return 'nv';
  if (h.startsWith('FECHA NV')) return 'fechaNV';
  if (/^(NRO |N |NUM |NUMERO )?CITA$/.test(h)) return 'nroCita';
  if (h.startsWith('FECHA C')) return 'fechaCita';
  if (h.startsWith('HORA')) return 'horaCita';
  if (h.includes('DIRECCION')) return 'direccion';
  if (h.includes('TRANSPORT')) return 'transportista';
  if (h.includes('RECEP')) return 'nvRecep';
  if (h.includes('PALLETIZADO')) return 'pallet';
  if (h.includes('BULTOS') || h.startsWith('PALLETS')) return 'pallets';
  if (h.includes('GUIA')) return 'nroGuia';
  if (h.includes('RECIBIDA') || h.includes('CONFORME')) return 'conforme';
  if (h.startsWith('OBSERV')) return 'obs';
  return null;
}
function toISODate(v) {
  if (v == null || v === '') return '';
  if (v instanceof Date) return isoOf(v);
  if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 86400000)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))) { let y = +m[3]; if (y < 100) y += 2000; return `${y}-${pad(+m[2])}-${pad(+m[1])}`; }
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  return '';
}
function toHHMM(v) {
  if (v === '' || v == null) return '';
  if (typeof v === 'number') { const mins = Math.round((v % 1) * 1440); return `${pad(Math.floor(mins / 60) % 24)}:${pad(mins % 60)}`; }
  const m = String(v).match(/(\d{1,2})[:.hH](\d{2})/);
  return m ? `${pad(+m[1])}:${m[2]}` : '';
}
function cleanStatus(v) {
  const s = nrmU(v); if (!s) return '';
  if (s === 'SI') return 'SI';
  if (s === 'NO') return 'NO';
  if (s === 'N A' || s === 'NA') return 'N/A';
  if (s.startsWith('EN PREPARACION')) return 'EN PREPARACIÓN';
  if (s === 'PREPARADO' || s === 'PENDIENTE' || s === 'DESPACHADA' || s === 'REPROGRAMADA' || s === 'CANCELADA') return s;
  return String(v).trim();
}
function importParse(buf) {
  if (typeof XLSX === 'undefined') throw new Error('No se cargó el lector de Excel. Revisa tu conexión y recarga la página.');
  const wb = XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
  const hi = rows.findIndex(r => r.some(x => nrmU(x) === 'CLIENTE') && r.some(x => nrmU(x) === 'NV'));
  if (hi < 0) throw new Error('No encontré la fila de encabezados. Necesito al menos las columnas CLIENTE y NV.');
  const map = {};
  rows[hi].forEach((h, i) => { const k = headerKey(nrmU(h)); if (k && !(k in map)) map[k] = i; });
  const existing = new Set(CITAS.map(c => [c.cliente, c.nv, c.fechaCita, c.horaCita].map(nrm).join('|')));
  const out = [], seen = new Set(); let dup = 0, nodate = 0, total = 0;
  rows.slice(hi + 1).forEach(r => {
    const g = k => (k in map ? r[map[k]] : '');
    const cliente = String(g('cliente') ?? '').trim(), nv = String(g('nv') ?? '').trim();
    if (!cliente && !nv) return;
    total++;
    const c = blank();
    c.cliente = cliente; c.nv = nv;
    c.oc = String(g('oc') ?? '').trim();
    c.nroCita = String(g('nroCita') ?? '').trim();
    c.direccion = String(g('direccion') ?? '').trim();
    c.transportista = String(g('transportista') ?? '').trim();
    c.pallets = String(g('pallets') ?? '').trim();
    c.nroGuia = String(g('nroGuia') ?? '').trim();
    c.obs = String(g('obs') ?? '').trim();
    c.fechaNV = toISODate(g('fechaNV')); c.fechaCita = toISODate(g('fechaCita')); c.horaCita = toHHMM(g('horaCita'));
    ['estado', 'nvRecep', 'pallet', 'conforme'].forEach(k => { c[k] = cleanStatus(g(k)); });
    if (!c.estado) c.estado = 'PENDIENTE';
    const key = [c.cliente, c.nv, c.fechaCita, c.horaCita].map(nrm).join('|');
    if (existing.has(key) || seen.has(key)) { dup++; return; }
    seen.add(key);
    if (!c.fechaCita) nodate++;
    out.push(c);
  });
  return {rows:out, dup, nodate, total, missing:['cliente', 'nv', 'fechaCita', 'direccion'].filter(k => !(k in map))};
}
function openImportPreview(name, res) {
  M = {kind:'import', res};
  const warn = res.missing.length ? `<div class="hint warn">No encontré estas columnas: ${res.missing.join(', ')}. Se importarán vacías.</div>` : '';
  openSheet('Importar desde Excel',
    `<div class="prev"><span class="muted">Archivo</span><b>${esc(name)}</b><span class="muted">Filas leídas</span><b>${res.total}</b><span class="muted">Citas nuevas</span><b>${res.rows.length}</b><span class="muted">Ya existentes (se omiten)</span><b>${res.dup}</b><span class="muted">Sin fecha de cita</span><b>${res.nodate}</b></div>${warn}<p class="muted" style="margin:0" id="impMsg">Se considera repetida una fila con el mismo cliente, NV, fecha y hora. Al importar no se envía un aviso por cada cita: llega un solo resumen a NTFY.</p>`,
    `<span class="grow"></span><button type="button" class="btn" id="mCancel">Cancelar</button><button type="button" class="btn primary" id="mImport"${(res.rows.length && can('importarExcel')) ? '' : ' disabled'}>Importar ${res.rows.length} citas</button>`);
}
async function runImport() {
  const rows = M.res.rows, btn = $('#mImport'), msg = $('#impMsg'); btn.disabled = true;
  let n = 0;
  try {
    for (let i = 0; i < rows.length; i += 400) {
      const chunk = rows.slice(i, i + 400), batch = db.batch();
      chunk.forEach(r => {
        const ref = db.collection('citas').doc();
        batch.set(ref, {...r, origen:'importacion', log:[{t:Date.now(), u:NOMBRE, f:'_creada'}], creadoPor:NOMBRE, creadoEn:firebase.firestore.FieldValue.serverTimestamp(), modificadoPor:NOMBRE, modificadoEn:firebase.firestore.FieldValue.serverTimestamp()});
      });
      await batch.commit();
      n += chunk.length; msg.textContent = `Importando ${n} de ${rows.length}…`;
    }
    await learnMaster(rows).catch(() => {});
    if (n > 0) {
      ntfyEnviar('Importación de citas', `${n} ${n === 1 ? 'cita' : 'citas'} importadas por ${shortName(NOMBRE)}`, ['inbox_tray'], 2).catch(() => {});
    }
    closeModal(); toast(`Se importaron ${n} citas`);
  } catch (e) { msg.textContent = `${errMsg(e)} Alcanzó a importar ${n} de ${rows.length}.`; msg.className = 'err-msg'; }
}

async function intentarLogin(uid, password) {
  const u = USUARIOS.find(x => x.id === uid);
  if (!u) throw new Error('Elige tu usuario de la lista.');
  const hash = await sha256hex(password);
  if (hash !== u.claveHash) throw new Error('Clave incorrecta.');
  aplicarSesion(u, hash);
}
function aplicarSesion(u, hash) {
  SESION = {uid: u.id}; NOMBRE = u.nombre; UID = u.id; ROLE = u.rol;
  ISADMIN = ROLE === 'admin';
  try { localStorage.setItem(SESION_KEY, JSON.stringify({uid: u.id, hash})); } catch (e) {}
  BANNER = ''; hideLogin(); renderMe();
  if (!STARTED) { STARTED = true; startData(); } else renderAll(true);
}
function cerrarSesion() {
  SESION = null; NOMBRE = ''; UID = ''; ROLE = ''; ISADMIN = false;
  try { localStorage.removeItem(SESION_KEY); } catch (e) {}
  renderMe(); if (STARTED) stopData(); showLogin(); setSync('off', 'Sin sesión'); renderAll(true);
}
async function sembrarAdminSiNoHay() {
  if (USUARIOS.length) return;
  const claveHash = await sha256hex('admin123');
  await db.collection('usuarios').doc('admin').set({
    nombre: 'Administrador', claveHash, rol: 'admin', creadoEn: firebase.firestore.FieldValue.serverTimestamp(), creadoPor: 'sistema',
  }).catch(() => {});
  BANNER = 'Se creó un usuario inicial: Administrador / admin123 — inicia sesión con él y cámbialo en "Usuarios y roles".';
  renderAll(true);
}
function onUsuarios(snap) {
  USUARIOS = snap.docs.map(d => ({id: d.id, ...d.data()}));
  USUARIOS_LISTOS = true;
  if (M && M.kind === 'usuarios') refreshUsuariosList();
  if (!SESION) {
    refreshLoginUserList();
    if (!USUARIOS.length) sembrarAdminSiNoHay();
    else restaurarSesionGuardada();
  } else {
    const yo = USUARIOS.find(u => u.id === UID);
    if (!yo) { toast('Se quitó tu acceso.', 'err'); cerrarSesion(); return; }
    ROLE = yo.rol; NOMBRE = yo.nombre;
    ISADMIN = ROLE === 'admin';
    renderMe(); renderAll(true);
  }
}
function restaurarSesionGuardada() {
  let saved; try { saved = JSON.parse(localStorage.getItem(SESION_KEY) || 'null'); } catch (e) { saved = null; }
  if (!saved) return;
  const u = USUARIOS.find(x => x.id === saved.uid);
  if (!u || u.claveHash !== saved.hash) { try { localStorage.removeItem(SESION_KEY); } catch (e) {} return; }
  aplicarSesion(u, saved.hash);
}
function looksConfigured() {
  return /^AIza/.test(FIREBASE_CONFIG.apiKey) && !/TU-PROYECTO|TU_/.test(FIREBASE_CONFIG.projectId + FIREBASE_CONFIG.apiKey + FIREBASE_CONFIG.appId);
}
function boot() {
  buildHead(); buildChips(); bind(); renderAll(true);
  if (!looksConfigured()) {
    BANNER = 'Falta configurar la conexión: edita FIREBASE_CONFIG al inicio de este archivo con los datos de tu proyecto Firebase.';
    setSync('off', 'Sin configurar'); renderAll(true); return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth(); db = firebase.firestore();
  showLogin(); setSync('wait', 'Conectando…');
  auth.signInAnonymously().then(() => {
    unsubs.push(db.collection('usuarios').onSnapshot(onUsuarios, err => { BANNER = errMsg(err); renderAll(true); }));
  }).catch(err => { BANNER = errMsg(err); setSync('off', 'Sin conexión'); renderAll(true); });
}
boot();
</script>
